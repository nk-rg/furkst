[package]
name = "furkst"
description = "A fast, friendly desktop git client built on gitoxide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
directories = "6.0.0"
eframe = "0.36.2"
egui = "0.36.2"
fontdb = "0.24.0"
furkst-core = { path = "../furkst-core" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[lints]
workspace = true

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
epaint_default_fonts = "0.36.2"
furkst-core = { path = "../furkst-core", features = ["test-support"] }
ttf-parser = "0.25.1"
