[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
# gitoxide is painfully slow unoptimized; keep our own crates fast to rebuild.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
